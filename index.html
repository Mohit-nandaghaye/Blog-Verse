<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogverse - Social & Blogging Platform</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        x: {
                            black: '#000000',
                            dark: '#0f1419',
                            card: '#16181c',
                            border: '#2f3336',
                            muted: '#71767b',
                            blue: '#6366f1',
                            blueHover: '#4f46e5',
                            pink: '#f91880',
                            green: '#00ba7c'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #e7e9ea;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #53585c; }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen flex justify-center selection:bg-x-blue selection:text-white">

    <div class="w-full max-w-7xl min-h-screen flex justify-between relative">

        <!-- LEFT NAVIGATION SIDEBAR -->
        <header class="w-16 xl:w-64 h-screen sticky top-0 flex flex-col justify-between p-2 xl:px-4 py-3 border-r border-x-border z-30 select-none">
            <div class="space-y-2">
                <div class="p-3 w-fit rounded-full hover:bg-white/10 cursor-pointer transition flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white font-black text-xl shadow-lg relative">
                        <i class="fa-solid fa-blog text-lg"></i>
                        <span id="cloudStatusDot" class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-black rounded-full shadow-sm animate-pulse" title="Firebase Cloud Sync Active"></span>
                    </div>
                    <div class="hidden xl:flex flex-col">
                        <span class="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">Blogverse</span>
                        <span class="text-[10px] text-emerald-400 font-bold tracking-widest uppercase -mt-1"><i class="fa-solid fa-cloud text-[9px] mr-1"></i>Cloud Live</span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button id="navHome" class="w-full flex items-center space-x-4 p-3 rounded-full hover:bg-white/10 transition text-xl font-medium">
                        <i class="fa-solid fa-house text-2xl w-7 text-center"></i>
                        <span class="hidden xl:inline">Home</span>
                    </button>
                    <button id="navExplore" class="w-full flex items-center space-x-4 p-3 rounded-full hover:bg-white/10 transition text-xl font-medium">
                        <i class="fa-solid fa-magnifying-glass text-2xl w-7 text-center"></i>
                        <span class="hidden xl:inline">Explore</span>
                    </button>
                </nav>

                <button class="w-full bg-x-blue hover:bg-x-blueHover text-white font-bold p-3 xl:py-3.5 rounded-full transition shadow-lg mt-4 flex items-center justify-center">
                    <i class="fa-solid fa-feather-pointed xl:hidden text-xl"></i>
                    <span class="hidden xl:inline text-lg">Post</span>
                </button>
            </div>

            <div id="sidebarUserBadge" class="p-2.5 rounded-full hover:bg-white/10 transition cursor-pointer flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img id="sidebarAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" class="w-10 h-10 rounded-full object-cover">
                    <div class="hidden xl:block leading-tight overflow-hidden">
                        <p id="sidebarName" class="font-bold text-sm truncate text-white">Guest User</p>
                        <p id="sidebarHandle" class="text-xs text-x-muted truncate">@guest</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN FEED -->
        <main class="flex-1 max-w-[600px] min-h-screen border-r border-x-border pb-16 sm:pb-0">
            <div id="viewHome" class="feed-view">
                <div class="sticky top-0 bg-black/80 backdrop-blur-md border-b border-x-border z-20 flex">
                    <button class="flex-1 py-3.5 hover:bg-white/5 transition text-center font-bold text-sm text-white border-b-4 border-x-blue">For you</button>
                    <button class="flex-1 py-3.5 hover:bg-white/5 transition text-center font-bold text-sm text-x-muted">Following</button>
                </div>

                <!-- Post Creator Input -->
                <div class="border-b border-x-border p-4 flex space-x-3">
                    <img id="composerUserAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" class="w-10 h-10 rounded-full object-cover">
                    <div class="flex-1">
                        <textarea id="inlinePostContent" rows="3" placeholder="What is happening?!" class="w-full bg-transparent text-lg text-white placeholder-x-muted border-none focus:outline-none resize-none leading-relaxed"></textarea>
                        <div class="flex items-center justify-between border-t border-x-border/60 pt-3">
                            <div class="flex items-center space-x-3 text-x-blue text-lg">
                                <button class="hover:bg-x-blue/10 p-2 rounded-full"><i class="fa-regular fa-image"></i></button>
                            </div>
                            <button id="btnSubmitPost" class="bg-x-blue hover:bg-x-blueHover text-white font-bold px-5 py-1.5 rounded-full text-sm transition shadow-md">
                                Post
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Posts List Container -->
                <div id="postsFeedContainer" class="divide-y divide-x-border">
                    <!-- Dynamic Firebase Posts load honege -->
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="hidden lg:block w-80 xl:w-88 p-3 space-y-4 sticky top-0 h-screen overflow-y-auto select-none">
            <div class="bg-x-card rounded-2xl p-4 space-y-2 border border-x-border/50">
                <h3 class="font-extrabold text-lg">Subscribe to Blogverse Premium</h3>
                <p class="text-xs text-x-muted leading-relaxed">Subscribe to unlock new blogging tools and custom domain integrations.</p>
            </div>
        </aside>

    </div>

    <!-- FIREBASE INTEGRATION SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Apna Firebase Config Yahan Paste Karein
        const firebaseConfig = {
             apiKey: "AIzaSyAf7IE-QCRwFZLTWwDCNnmjRpkY0zWcnhk",
  authDomain: "blogverse-b52f6.firebaseapp.com",
  databaseURL: "https://blogverse-b52f6-default-rtdb.firebaseio.com",
  projectId: "blogverse-b52f6",
  storageBucket: "blogverse-b52f6.firebasestorage.app",
  messagingSenderId: "961056628298",
  appId: "1:961056628298:web:5a858ccca07d585c9790b3",
  measurementId: "G-CQD7RCHJ8K"
        };

        // Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. Post Create (Save in Firestore)
        const submitBtn = document.getElementById('btnSubmitPost');
        const postInput = document.getElementById('inlinePostContent');

        submitBtn.addEventListener('click', async () => {
            const content = postInput.value.trim();
            if (!content) return alert('Please enter some text!');

            try {
                await addDoc(collection(db, "posts"), {
                    author: "Guest User",
                    handle: "@guest",
                    content: content,
                    timestamp: serverTimestamp()
                });
                postInput.value = '';
            } catch (error) {
                console.error("Error adding post: ", error);
            }
        });

        // 3. Live Posts Render (Realtime Updates)
        const feedContainer = document.getElementById('postsFeedContainer');
        const postsQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"));

        onSnapshot(postsQuery, (snapshot) => {
            feedContainer.innerHTML = '';
            snapshot.forEach((doc) => {
                const post = doc.data();
                const postHTML = `
                    <div class="p-4 border-b border-x-border hover:bg-white/[0.02] transition">
                        <div class="flex space-x-3">
                            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" class="w-10 h-10 rounded-full">
                            <div class="flex-1">
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-white">${post.author || 'User'}</span>
                                    <span class="text-xs text-x-muted">${post.handle || '@user'}</span>
                                </div>
                                <p class="text-white mt-1">${post.content}</p>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.insertAdjacentHTML('beforeend', postHTML);
            });
        });
    </script>
</body>
</html>
