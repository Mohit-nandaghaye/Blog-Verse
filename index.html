<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogVerse — Instagram Feed & Followers Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="setFeedMode('explore')">
                <div class="bg-emerald-500 text-slate-900 font-black px-2.5 py-1 rounded-lg text-lg">BV</div>
                <div>
                    <h1 class="font-bold text-lg leading-none">BlogVerse</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider mt-0.5">Owned by MOHIT NANDAGHAYE</p>
                </div>
            </div>

            <!-- Feed Mode Toggle -->
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700 text-xs">
                <button onclick="setFeedMode('explore')" id="btn-explore" class="px-3 py-1.5 rounded-lg font-bold bg-emerald-500 text-slate-900">Explore</button>
                <button onclick="setFeedMode('following')" id="btn-following" class="px-3 py-1.5 rounded-lg font-bold text-slate-400">Following Feed</button>
            </div>

            <div class="flex items-center space-x-3" id="nav-auth"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        
        <!-- Feed Header -->
        <div class="mb-6 flex justify-between items-center">
            <h2 id="feed-heading" class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-compass text-emerald-400"></i> Explore All Posts
            </h2>
            <button onclick="toggleEditor(true)" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold px-4 py-2 rounded-xl text-xs transition">+ Create Post</button>
        </div>

        <!-- Editor Modal / Box -->
        <section id="editor-section" class="hidden mb-8 bg-slate-800 border border-emerald-500/50 rounded-2xl p-6 shadow-xl">
            <h3 id="editor-title" class="text-lg font-bold text-emerald-400 mb-4">Publish New Post</h3>
            <form onsubmit="handlePostSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-article-id" value="">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Title</label>
                    <input type="text" id="post-title" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Content</label>
                    <textarea id="post-content" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500 text-sm"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="toggleEditor(false)" class="px-4 py-2 text-slate-400 text-xs font-semibold">Cancel</button>
                    <button type="submit" id="save-post-btn" class="bg-emerald-500 text-slate-900 font-bold px-5 py-2 rounded-xl text-xs">Publish</button>
                </div>
            </form>
        </section>

        <!-- Feed List -->
        <div id="articles-feed" class="space-y-6">
            <p class="text-slate-400 text-sm">Loading feed...</p>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRe5ja_JmKkZwlXjRY0UmBEgwdLeM8vNw",
            authDomain: "blogverse-f45bf.firebaseapp.com",
            projectId: "blogverse-f45bf",
            storageBucket: "blogverse-f45bf.firebasestorage.app",
            messagingSenderId: "903299334786",
            appId: "1:903299334786:web:cba3a6f203db7504106a9b",
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let currentFeedMode = 'explore';
        let followedUserIds = [];

        auth.onAuthStateChanged(async user => {
            currentUser = user;
            renderNav();
            if (currentUser) {
                await fetchFollowingList();
            }
            loadFeed();
        });

        async function fetchFollowingList() {
            if (!currentUser) return;
            const snap = await db.collection("users").doc(currentUser.uid).collection("following").get();
            followedUserIds = snap.docs.map(doc => doc.id);
        }

        function renderNav() {
            const nav = document.getElementById('nav-auth');
            if (currentUser) {
                nav.innerHTML = `
                    <span class="text-xs text-slate-300 font-medium"><i class="fa-solid fa-user-circle text-emerald-400"></i> ${currentUser.displayName || currentUser.email.split('@')[0]}</span>
                    <button onclick="auth.signOut()" class="text-xs bg-slate-800 text-slate-400 px-3 py-1.5 rounded-lg border border-slate-700">Logout</button>
                `;
            } else {
                nav.innerHTML = `<button onclick="auth.signInAnonymously()" class="text-xs bg-emerald-500 text-slate-900 font-bold px-3 py-1.5 rounded-lg">Quick Guest Login</button>`;
            }
        }

        function setFeedMode(mode) {
            currentFeedMode = mode;
            document.getElementById('btn-explore').className = mode === 'explore' ? 'px-3 py-1.5 rounded-lg font-bold bg-emerald-500 text-slate-900' : 'px-3 py-1.5 rounded-lg font-bold text-slate-400';
            document.getElementById('btn-following').className = mode === 'following' ? 'px-3 py-1.5 rounded-lg font-bold bg-emerald-500 text-slate-900' : 'px-3 py-1.5 rounded-lg font-bold text-slate-400';
            document.getElementById('feed-heading').innerHTML = mode === 'explore' ? '<i class="fa-solid fa-compass text-emerald-400"></i> Explore All Posts' : '<i class="fa-solid fa-user-group text-emerald-400"></i> Following Feed';
            loadFeed();
        }

        function loadFeed() {
            let query = db.collection("articles").orderBy("timestamp", "desc");

            if (currentFeedMode === 'following') {
                if (!currentUser) {
                    document.getElementById('articles-feed').innerHTML = `<p class="text-slate-400 text-sm">Please log in to view your personalized following feed.</p>`;
                    return;
                }
                const filterIds = [...followedUserIds, currentUser.uid];
                if (filterIds.length === 0) {
                    document.getElementById('articles-feed').innerHTML = `<p class="text-slate-400 text-sm">You are not following anyone yet.</p>`;
                    return;
                }
                query = query.where("authorId", "in", filterIds.slice(0, 10));
            }

            query.onSnapshot(snapshot => {
                const feed = document.getElementById('articles-feed');
                if (snapshot.empty) {
                    feed.innerHTML = `<p class="text-slate-400 text-sm">No posts found.</p>`;
                    return;
                }

                feed.innerHTML = snapshot.docs.map(doc => {
                    const art = doc.data();
                    const docId = doc.id;
                    const isOwner = currentUser && art.authorId === currentUser.uid;
                    const isFollowing = followedUserIds.includes(art.authorId);

                    return `
                        <div class="bg-slate-800/60 border border-slate-800 rounded-2xl p-5 space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="font-bold text-sm text-slate-200">${art.author}</span>
                                    ${currentUser && !isOwner ? `
                                        <button onclick="toggleFollow('${art.authorId}')" class="text-[10px] font-bold px-2 py-0.5 rounded-full ${isFollowing ? 'bg-slate-700 text-slate-300' : 'bg-emerald-500 text-slate-900'}">
                                            ${isFollowing ? 'Following' : '+ Follow'}
                                        </button>
                                    ` : ''}
                                </div>
                                ${isOwner ? `
                                    <button onclick="openEditModal('${docId}', \`${art.title}\`, \`${art.excerpt}\`)" class="text-xs text-amber-400 hover:underline">
                                        <i class="fa-solid fa-pen"></i> Edit
                                    </button>
                                ` : ''}
                            </div>

                            <div>
                                <h3 class="text-lg font-bold text-slate-100">${art.title}</h3>
                                <p class="text-slate-300 text-sm mt-1">${art.excerpt}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            });
        }

        function toggleEditor(show) {
            document.getElementById('editor-section').classList.toggle('hidden', !show);
            if (!show) {
                document.getElementById('edit-article-id').value = '';
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
            }
        }

        function openEditModal(id, title, content) {
            document.getElementById('edit-article-id').value = id;
            document.getElementById('post-title').value = title;
            document.getElementById('post-content').value = content;
            document.getElementById('editor-title').innerText = "Edit Your Post";
            document.getElementById('save-post-btn').innerText = "Update Post";
            toggleEditor(true);
        }

        async function handlePostSubmit(e) {
            e.preventDefault();
            if (!currentUser) return;

            const editId = document.getElementById('edit-article-id').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;

            if (editId) {
                await db.collection("articles").doc(editId).update({
                    title: title,
                    excerpt: content,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } else {
                await db.collection("articles").add({
                    title: title,
                    excerpt: content,
                    author: currentUser.displayName || currentUser.email.split('@')[0],
                    authorId: currentUser.uid,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }

            toggleEditor(false);
        }

        async function toggleFollow(targetUserId) {
            if (!currentUser) return;
            const followingRef = db.collection("users").doc(currentUser.uid).collection("following").doc(targetUserId);
            const doc = await followingRef.get();

            if (doc.exists) {
                await followingRef.delete();
                followedUserIds = followedUserIds.filter(id => id !== targetUserId);
            } else {
                await followingRef.set({ followedAt: firebase.firestore.FieldValue.serverTimestamp() });
                followedUserIds.push(targetUserId);
            }
            loadFeed();
        }
    </script>
</body>
</html>
