<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogVerse — Platform Owned by MOHIT NANDAGHAYE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-900 font-black px-2.5 py-1 rounded-lg text-lg">BV</div>
                <div>
                    <h1 class="font-bold text-lg leading-none">BlogVerse</h1>
                    <p class="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase mt-0.5">Owned by MOHIT NANDAGHAYE</p>
                </div>
            </div>

            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300">
                <a href="#home" class="hover:text-emerald-400 transition"><i class="fa-solid fa-house mr-1"></i> Home</a>
                <a href="#articles" class="hover:text-emerald-400 transition"><i class="fa-solid fa-newspaper mr-1"></i> Articles</a>
                <a href="#create" class="hover:text-emerald-400 transition"><i class="fa-solid fa-pen-to-square mr-1"></i> Write</a>
            </nav>

            <div class="flex items-center space-x-3" id="auth-nav-area">
                <!-- Dynamic Auth Buttons injected via JavaScript -->
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        
        <!-- Platform Ownership Banner -->
        <section class="mb-10 bg-gradient-to-r from-emerald-900/40 via-slate-800 to-slate-900 border border-emerald-500/30 rounded-2xl p-6 relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <span class="bg-emerald-500/20 text-emerald-300 text-xs px-3 py-1 rounded-full border border-emerald-500/30 font-semibold">Official Platform</span>
                    <h2 class="text-2xl md:text-3xl font-bold mt-2">Welcome to BlogVerse</h2>
                    <p class="text-slate-400 text-sm mt-1">Platform Architecture & Sole Ownership managed by <span class="text-emerald-400 font-bold">MOHIT NANDAGHAYE</span>.</p>
                </div>
                <div>
                    <button onclick="openAuthModal('signup')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold px-5 py-2.5 rounded-xl shadow-lg transition">
                        Start Writing
                    </button>
                </div>
            </div>
        </section>

        <!-- Articles Section -->
        <section id="articles" class="space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-emerald-400"></i> Published Articles
                </h3>
            </div>

            <!-- Articles Container -->
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Injected via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Dedicated Auth Modal (Login / Sign Up) -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-100">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <!-- Tabs -->
            <div class="flex border-b border-slate-800 mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 font-bold text-center border-b-2 border-emerald-500 text-emerald-400">Login</button>
                <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2 font-bold text-center text-slate-400 border-b-2 border-transparent">Sign Up</button>
            </div>

            <!-- Auth Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs text-slate-400 mb-1">Full Name</label>
                    <input type="text" id="auth-name" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Email Address</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="user@domain.com">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                </div>
                <button type="submit" id="auth-btn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-bold py-2.5 rounded-xl transition mt-4">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900 mt-12 py-6 text-center text-xs text-slate-500">
        <p>BlogVerse Platform © <span id="year"></span> | Designed, Developed & Owned by <strong class="text-slate-300">MOHIT NANDAGHAYE</strong>.</p>
    </footer>

    <!-- Application JavaScript Logic -->
    <script>
        document.getElementById('year').innerText = new Date().getFullYear();

        // Locked Owner Information (Immutable)
        const OWNER_NAME = "MOHIT NANDAGHAYE";

        // Initial Real Articles (4 Published Articles by Owner)
        const defaultArticles = [
            {
                id: 1,
                title: "Building Scalable Modern Web Applications",
                category: "Technology",
                excerpt: "An architectural guide on developing lightweight and responsive web services with clean frontend patterns.",
                author: OWNER_NAME,
                date: "Oct 02, 2026"
            },
            {
                id: 2,
                title: "The Future of Digital Publishing & Content Rights",
                category: "Business",
                excerpt: "Exploring how content creators can safeguard ownership while engaging audiences in decentralized web environments.",
                author: OWNER_NAME,
                date: "Oct 03, 2026"
            },
            {
                id: 3,
                title: "Mastering Clean JavaScript without Framework Bloat",
                category: "Engineering",
                excerpt: "Why pure JavaScript and native APIs remain the ultimate foundation for ultra-fast digital products.",
                author: OWNER_NAME,
                date: "Oct 04, 2026"
            },
            {
                id: 4,
                title: "Innovating Beyond Boundaries: A Product Playbook",
                category: "Creativity",
                excerpt: "Transforming original ideas into sustainable digital platforms through structured execution.",
                author: OWNER_NAME,
                date: "Oct 05, 2026"
            }
        ];

        let currentAuthMode = 'login';
        let currentUser = JSON.parse(localStorage.getItem('bv_user')) || null;

        function renderNav() {
            const navArea = document.getElementById('auth-nav-area');
            if (currentUser) {
                navArea.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="text-sm font-medium text-emerald-400"><i class="fa-solid fa-user-circle mr-1"></i> ${currentUser.name}</span>
                        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">Logout</button>
                    </div>
                `;
            } else {
                navArea.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-sm font-medium text-slate-300 hover:text-slate-100 px-3 py-1.5">Log In</button>
                    <button onclick="openAuthModal('signup')" class="text-sm font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-4 py-1.5 rounded-lg transition">Sign Up</button>
                `;
            }
        }

        function renderArticles() {
            const grid = document.getElementById('articles-grid');
            grid.innerHTML = defaultArticles.map(art => `
                <div class="bg-slate-800/50 border border-slate-800 hover:border-slate-700 rounded-2xl p-5 transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-emerald-400 bg-emerald-950/60 px-2.5 py-0.5 rounded-md border border-emerald-800/50">${art.category}</span>
                            <span class="text-xs text-slate-500">${art.date}</span>
                        </div>
                        <h4 class="text-lg font-bold text-slate-100 mb-2">${art.title}</h4>
                        <p class="text-slate-400 text-sm leading-relaxed mb-4">${art.excerpt}</p>
                    </div>
                    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                        <span>By <strong class="text-slate-200">${art.author}</strong></span>
                        <span class="text-emerald-400 hover:underline cursor-pointer">Read Full Article →</span>
                    </div>
                </div>
            `).join('');
        }

        function openAuthModal(mode) {
            currentAuthMode = mode;
            switchTab(mode);
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function switchTab(mode) {
            currentAuthMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const nameField = document.getElementById('name-field');
            const authBtn = document.getElementById('auth-btn');

            if (mode === 'signup') {
                tabSignup.className = "flex-1 py-2 font-bold text-center border-b-2 border-emerald-500 text-emerald-400";
                tabLogin.className = "flex-1 py-2 font-bold text-center text-slate-400 border-b-2 border-transparent";
                nameField.classList.remove('hidden');
                authBtn.innerText = "Create Account";
            } else {
                tabLogin.className = "flex-1 py-2 font-bold text-center border-b-2 border-emerald-500 text-emerald-400";
                tabSignup.className = "flex-1 py-2 font-bold text-center text-slate-400 border-b-2 border-transparent";
                nameField.classList.add('hidden');
                authBtn.innerText = "Sign In";
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const name = currentAuthMode === 'signup' ? document.getElementById('auth-name').value || "Author" : email.split('@')[0];

            currentUser = { name, email };
            localStorage.setItem('bv_user', JSON.stringify(currentUser));
            
            renderNav();
            closeAuthModal();
        }

        function logout() {
            localStorage.removeItem('bv_user');
            currentUser = null;
            renderNav();
        }

        // Initialize App
        renderNav();
        renderArticles();
    </script>
</body>
</html>
